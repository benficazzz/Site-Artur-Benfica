<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Estúdio Benfica</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#070a12" />
  <link rel="icon" href="/assets/logo/svg/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Archivo:wght@400;600&family=IBM+Plex+Mono:wght@500&family=Syne:wght@800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #070a12 radial-gradient(900px 600px at 80% -10%, rgba(37,99,255,.16), transparent 60%) no-repeat; color: #f5f7fa; font: 16px/1.6 Archivo, system-ui, sans-serif; text-align: center; padding: 24px; }
    main { max-width: 520px; opacity: 0; transition: opacity .3s; }
    html.nao-achou main, html.sem-apelido main { opacity: 1; }
    .marca { display: inline-flex; align-items: center; gap: 12px; color: #f5f7fa; text-decoration: none; margin-bottom: 40px; }
    .marca svg { width: 44px; }
    .marca span { font: 800 1.2rem/0.95 Syne, sans-serif; text-align: left; }
    .marca small { display: block; font: 500 .55rem "IBM Plex Mono", monospace; letter-spacing: .32em; opacity: .8; margin-bottom: 3px; }
    .rotulo { font: 500 .75rem "IBM Plex Mono", monospace; letter-spacing: .2em; color: #c8ff1a; margin: 0 0 10px; }
    .codigo { font: 800 clamp(5rem, 26vw, 9rem)/1 Sora, sans-serif; letter-spacing: -.05em; margin: 0; background: linear-gradient(90deg, #f5f7fa, #2563ff 60%, #c8ff1a); -webkit-background-clip: text; background-clip: text; color: transparent; }
    h1 { font: 700 1.5rem/1.2 Sora, sans-serif; margin: 10px 0 8px; }
    p { color: #c3cce0; margin: 0 0 28px; }
    .acoes { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn { display: inline-flex; padding: 14px 26px; border-radius: 999px; font-weight: 600; text-decoration: none; }
    .btn--lime { background: #c8ff1a; color: #07080b; box-shadow: 0 10px 30px -4px rgba(200,255,26,.38); }
    .btn--ghost { border: 1px solid rgba(255,255,255,.22); color: #f5f7fa; }
    a:focus-visible { outline: 2px solid #c8ff1a; outline-offset: 3px; }
  </style>
  <script>
    /* Links curtos: benficazzz.github.io/<apelido> → loja do evento.
       Também leva endereços antigos (/Site-Artur-Benfica/...) para o endereço novo. */
    (function () {
      var p = location.pathname, base = "/";
      if (p.indexOf("/Site-Artur-Benfica/") === 0) { base = "/Site-Artur-Benfica/"; }
      var apelido = decodeURIComponent(p.slice(base.length)).replace(/\/+$/, "").toLowerCase();
      if (!/^[a-z0-9-]{3,40}$/.test(apelido)) { document.documentElement.classList.add("sem-apelido"); return; }
      var url = "https://firestore.googleapis.com/v1/projects/estudio-benfica/databases/(default)/documents/links/" + apelido + "?key=AIzaSyBFb0wFFU4q2YNRlW2aEHpVJ4_lnyKLwIU";
      fetch(url).then(function (r) { return r.ok ? r.json() : null; }).then(function (d) {
        var ev = d && d.fields && d.fields.evento && d.fields.evento.stringValue;
        if (ev) location.replace(base + "loja.html#evento/" + encodeURIComponent(ev));
        else document.documentElement.classList.add("nao-achou");
      }).catch(function () { document.documentElement.classList.add("nao-achou"); });
    })();
  </script>
</head>
<body>
  <main>
    <a class="marca" href="/" aria-label="Estúdio Benfica, página inicial">
      <svg viewBox="0 0 100 100" aria-hidden="true"><path d="M8 30V8h22M70 8h22v22M92 70v22H70M30 92H8V70" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M40 31 L71 50 L40 69 Z" fill="#c8ff1a" stroke="#c8ff1a" stroke-width="6" stroke-linejoin="round"/></svg>
      <span><small>ESTÚDIO</small>BENFICA</span>
    </a>
    <p class="rotulo">FORA DE QUADRO</p>
    <p class="codigo">404</p>
    <h1>Essa página não está no enquadramento.</h1>
    <p>O endereço não existe ou o evento saiu do ar. Que tal procurar suas fotos na loja?</p>
    <div class="acoes"><a class="btn btn--lime" href="/loja.html">Ver a loja</a><a class="btn btn--ghost" href="/">Ir para o site</a></div>
  </main>
</body>
</html>
